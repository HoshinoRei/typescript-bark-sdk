name: Lint
on:
  pull_request:
  push:
    branches:
      - master
permissions:
  contents: read
jobs:
  check:
    name: Check format and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check format
        run: bun run fmt:check
      - name: Check lint
        run: bun run lint:check
