name: Test
on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/test.yml
      - bun.lock
      - bunfig.toml
      - package.json
      - tsconfig.json
      - .prettierrc.yml
      - .prettierignore
      - eslint.config.mjs
      - mod.ts
      - bark_client.ts
      - bark_message_builder.ts
      - enums/**
      - errors/**
      - types/**
      - internal/**
      - scripts/**
      - tests/**
  pull_request:
    paths:
      - .github/workflows/test.yml
      - bun.lock
      - bunfig.toml
      - package.json
      - tsconfig.json
      - .prettierrc.yml
      - .prettierignore
      - eslint.config.mjs
      - mod.ts
      - bark_client.ts
      - enums/**
      - errors/**
      - types/**
      - internal/**
      - scripts/**
      - tests/**
jobs:
  bun-test:
    name: Bun Test
    permissions:
      checks: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run unit test
        env:
          CI: true
        run: bun run test
      - name: Publish Test Report
        if: success() || failure()
        uses: phoenix-actions/test-reporting@v16
        with:
          name: Bun Tests
          path: test-result/bun-junit.xml
          output-to: step-summary
          reporter: jest-junit
      - name: Upload coverage report
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-bun-lcov
          path: test-result/bun-coverage/lcov.info
      - name: Report Bun coverage
        if: (success() || failure()) && github.event_name == 'pull_request'
        run: bun run scripts/report_bun_coverage.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
