name: Document
on:
  pull_request:
    paths:
      - .github/workflows/document.yml
      - bun.lock
      - package.json
      - tsconfig.json
      - .prettierrc.yml
      - .prettierignore
      - eslint.config.mjs
      - mod.ts
      - bark_client.ts
      - bark_message_builder.ts
      - enums/**
      - errors/**
      - types/**
      - internal/**
  push:
    branches:
      - master
    paths:
      - .github/workflows/document.yml
      - bun.lock
      - package.json
      - tsconfig.json
      - .prettierrc.yml
      - .prettierignore
      - eslint.config.mjs
      - mod.ts
      - bark_client.ts
      - bark_message_builder.ts
      - enums/**
      - errors/**
      - types/**
      - internal/**
permissions:
  contents: read
jobs:
  document:
    name: Validate public API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check public API
        run: bun run check
